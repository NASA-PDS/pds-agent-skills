# NASA-PDS Product-to-Repository Mapping
# This file maps PDS repositories to product categories for organizational and tooling purposes
#
# Format:
#   products:
#     <product-name>:
#       description: Brief description of the product
#       github_project_name: "Name in GitHub Projects" (optional - only for products used in planning)
#       work_stream: "core-data-services" | "planetary-data-cloud" | "web-modernization" (optional)
#       work_area: GitHub org issue field value — one of:
#                  "Core Data Services" | "PDS Operations" | "PDC Cloud Operations" |
#                  "PDC Node Support" | "PDC Platform Engineering" | "PDS Cybersecurity" |
#                  "Planetary Data UX"
#       ignore: true/false - if true, this product should be ignored by any processing tool / software
#       core_backbone: true/false - if true, repositories in this product receive +2 scoring bonus (critical infrastructure)
#       core_backbone_justification: Rationale for core backbone designation (optional, for documentation)
#       repositories:
#         - repo-name
#
# IMPORTANT: Core Backbone products should be reviewed quarterly
# Next review date: 2026-08-28
products:
  deep-archive:
    description: "PDS Open Archival Information System (OAIS) utilities for deep archive operations"
    github_project_name: "Deep Archive"
    work_stream: "core-data-services"
    work_area: "Core Data Services"
    repositories:
      - deep-archive

  devops:
    description: "DevOps tools, CI/CD pipelines, and automation infrastructure"
    github_project_name: "DevOps"
    work_stream: "core-data-services"
    work_area: "Core Data Services"
    repositories:
      - devops
      - github-actions-base
      - git-ping
      - roundup-action
      - ldd-gen-action
      - pdsen-corral
      - pdsen-maven-parent

  doi-service:
    description: "Digital Object Identifier (DOI) service for PDS data products"
    github_project_name: "DOI Service"
    work_stream: "core-data-services"
    work_area: "Core Data Services"
    repositories:
      - doi-service

  pds4-information-model:
    description: "PDS4 Information Model, ontology, and data dictionary tools"
    github_project_name: "PDS4 Information Model"
    work_stream: "core-data-services"
    work_area: "Core Data Services"
    repositories:
      - pds4-information-model
      - ldd-manager
      - ldd-dashboard
      - PDS4-CCB
      - pds4-context-products

  pds4-viewer:
    description: "Tools for viewing and visualizing PDS4 data products"
    github_project_name: "PDS View"
    work_stream: "core-data-services"
    work_area: "Core Data Services"
    repositories:
      - pds4-viewer-support
      - pds4-jparser
      - portal-ds-view
      - pds4_tools_prototype

  peppi:
    description: "Planetary Data Explorer Python (PEPPi) client library"
    github_project_name: "peppi"
    work_stream: "core-data-services"
    work_area: "Core Data Services"
    core_backbone: true
    core_backbone_justification: "Key client library for programmatic data access"
    repositories:
      - peppi

  registry-tools:
    description: "PDS Registry backend services and data loading tools"
    github_project_name: "Registry Tools"
    work_stream: "core-data-services"
    work_area: "Core Data Services"
    core_backbone: true
    core_backbone_justification: "Core data storage, search, and retrieval infrastructure"
    repositories:
      - registry
      - registry-api
      - registry-client
      - registry-common
      - registry-dashboards
      - registry-legacy-solr
      - registry-loader
      - registry-mgr
      - registry-operations
      - registry-ref-data
      - registry-stac-api
      - registry-sweepers
      - harvest
      - pds4-graph

  search-api:
    description: "PDS Search API and client libraries"
    github_project_name: "Search API"
    work_stream: "core-data-services"
    work_area: "Core Data Services"
    core_backbone: true
    core_backbone_justification: "Primary public API for accessing PDS data"
    repositories:
      - pds-api
      - pds-api-client
      - search-api-notebook
